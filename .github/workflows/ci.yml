name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: node --check src/bridge.js
      - name: Shell check
        run: |
          sh -n scripts/start.sh
          sh -n scripts/stop.sh
          sh -n scripts/supervise.sh
          sh -n hooks/session-start.sh
